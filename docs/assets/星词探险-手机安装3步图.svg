<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">星词探险手机安装 3 步图</title>
  <desc id="desc">iPhone 使用 Safari 打开、点击分享、添加到主屏幕；Android 使用 Chrome 打开、点击菜单、添加到主屏幕或安装应用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3d8"/>
      <stop offset="48%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#dff0ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a5b"/>
      <stop offset="100%" stop-color="#f15b3d"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f9f90"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .font { font-family: "PingFang SC"; }
      .title { font-size: 64px; font-weight: 900; fill: #17324d; letter-spacing: 2px; }
      .subtitle { font-size: 30px; font-weight: 700; fill: #64748b; }
      .card-title { font-size: 34px; font-weight: 900; fill: #17324d; }
      .step-no { font-size: 34px; font-weight: 900; fill: #fff; }
      .body { font-size: 28px; font-weight: 760; fill: #17324d; }
      .muted { font-size: 23px; font-weight: 700; fill: #64748b; }
      .tiny { font-size: 21px; font-weight: 700; fill: #7b8da3; }
      .label { font-size: 22px; font-weight: 900; fill: #fff; }
      .url { font-size: 24px; font-weight: 800; fill: #17324d; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7fbff"/>
  <circle cx="180" cy="150" r="140" fill="#fff1bf" opacity="0.55" filter="url(#soft)"/>
  <circle cx="1390" cy="690" r="180" fill="#ffd7d0" opacity="0.38" filter="url(#soft)"/>
  <circle cx="1210" cy="180" r="120" fill="#bdf7ee" opacity="0.34" filter="url(#soft)"/>

  <rect x="54" y="44" width="1492" height="812" rx="54" fill="#ffffff" fill-opacity="0.78" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>

  <g class="font">
    <g transform="translate(112 86)">
      <rect x="0" y="2" width="78" height="78" rx="22" fill="#18b7aa"/>
      <rect x="25" y="22" width="30" height="38" rx="5" fill="none" stroke="#fff" stroke-width="5"/>
      <rect x="16" y="14" width="30" height="38" rx="5" fill="none" stroke="#fff" stroke-width="5" opacity="0.78"/>
      <text x="104" y="52" class="title">星词探险</text>
      <text x="106" y="94" class="subtitle">3 步安装到手机桌面</text>
    </g>

    <g transform="translate(112 214)">
      <rect x="0" y="0" width="1376" height="96" rx="34" fill="#ff6b45"/>
      <text x="58" y="61" font-size="34" font-weight="900" fill="#fff">打开星词探险，3 步添加到手机桌面</text>
      <text x="790" y="60" font-size="27" font-weight="800" fill="#fff" opacity="0.92">iPhone 用 Safari｜Android 用 Chrome</text>
    </g>

    <g transform="translate(112 360)">
      <g filter="url(#shadow)">
        <rect x="0" y="0" width="416" height="330" rx="36" fill="#fff"/>
      </g>
      <circle cx="68" cy="66" r="34" fill="#ff6b45"/>
      <text x="57" y="78" class="step-no">1</text>
      <text x="122" y="78" class="card-title">打开链接</text>
      <rect x="58" y="126" width="300" height="76" rx="24" fill="#f8fafc" stroke="#e5eaf1" stroke-width="3"/>
      <text x="92" y="174" class="body">Safari / Chrome</text>
      <path d="M102 250 C140 218 184 218 222 250 C260 282 304 282 342 250" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/>
      <text x="58" y="292" class="muted">点击我们发你的网页地址</text>
    </g>

    <g transform="translate(592 360)">
      <g filter="url(#shadow)">
        <rect x="0" y="0" width="416" height="330" rx="36" fill="#fff"/>
      </g>
      <circle cx="68" cy="66" r="34" fill="#ff6b45"/>
      <text x="57" y="78" class="step-no">2</text>
      <text x="122" y="78" class="card-title">点分享 / 菜单</text>
      <g transform="translate(68 126)">
        <rect x="0" y="0" width="132" height="76" rx="24" fill="#eef6ff" stroke="#c7defb" stroke-width="3"/>
        <path d="M66 50 V20 M50 36 L66 20 L82 36" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M43 43 V58 H89 V43" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="116" class="tiny">iPhone 分享</text>
      </g>
      <g transform="translate(235 126)">
        <rect x="0" y="0" width="112" height="76" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
        <circle cx="56" cy="24" r="5" fill="#f97316"/>
        <circle cx="56" cy="38" r="5" fill="#f97316"/>
        <circle cx="56" cy="52" r="5" fill="#f97316"/>
        <text x="8" y="116" class="tiny">Android 菜单</text>
      </g>
      <text x="58" y="292" class="muted">找到浏览器底部或右上角按钮</text>
    </g>

    <g transform="translate(1072 360)">
      <g filter="url(#shadow)">
        <rect x="0" y="0" width="416" height="330" rx="36" fill="#fff"/>
      </g>
      <circle cx="68" cy="66" r="34" fill="#ff6b45"/>
      <text x="57" y="78" class="step-no">3</text>
      <text x="122" y="78" class="card-title">添加到桌面</text>
      <rect x="72" y="122" width="272" height="72" rx="24" fill="#f0fdfa" stroke="#99f6e4" stroke-width="3"/>
      <text x="104" y="168" class="body" fill="#0f766e">添加到主屏幕</text>
      <rect x="116" y="222" width="184" height="50" rx="22" fill="#18b7aa"/>
      <text x="158" y="255" class="label">像 App 一样用</text>
      <text x="58" y="292" class="muted">桌面出现“星词”图标即可</text>
    </g>

    <g transform="translate(112 740)">
      <rect x="0" y="0" width="1376" height="74" rx="28" fill="#f8fafc" stroke="#e5eaf1" stroke-width="3"/>
      <text x="42" y="47" class="url">访问地址：</text>
      <text x="182" y="47" class="url" fill="#f05f3c">https://vincentliu134-source.github.io/english-word-pwa/enhanced-word-tool.html</text>
    </g>
  </g>
</svg>
